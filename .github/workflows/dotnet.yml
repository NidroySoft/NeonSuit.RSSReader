name: Backend .NET 10

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore backend
        run: dotnet restore NeonSuit.RSSReader.Backend.slnx -p:RestoreDisableParallel=true
      - name: Build backend
        run: dotnet build NeonSuit.RSSReader.Backend.slnx --no-restore -c Release -m:1
      - name: Test backend
        run: dotnet test NeonSuit.RSSReader.Backend.slnx --no-build -c Release -m:1 --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ matrix.os }}
          path: TestResults/*.trx
